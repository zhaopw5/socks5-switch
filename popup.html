<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SOCKS5</title>
<style>
  :root { --line:#e3e5e8; --text:#1f1f1f; --muted:#6b7075; --blue:#0b57d0; }
  * { box-sizing: border-box; }
  body {
    width: 300px; margin: 0; padding: 14px;
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text); background: #fff;
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .head b { font-size: 13px; font-weight: 600; }
  #state { font-size: 12px; color: var(--muted); }
  #state.on { color: #1e7b34; }
  #state.warn { color: #b26a00; }
  #state.bad { color: #a33; }

  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 9px 0;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .label { font-size: 12.5px; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .switch { position: relative; display: inline-block; width: 38px; height: 21px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #cfd3d8; border-radius: 11px; transition: background .15s; }
  .slider::before {
    content: ""; position: absolute; width: 17px; height: 17px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%; transition: transform .15s;
  }
  .switch input:checked + .slider { background: #1e7b34; }
  .switch input:checked + .slider::before { transform: translateX(17px); }
  .switch input:disabled + .slider { opacity: .45; }

  .fields { display: flex; gap: 8px; margin: 2px 0 10px; }
  .fields label { flex: 1; font-size: 11px; color: var(--muted); }
  .fields input {
    width: 100%; margin-top: 3px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 7px;
    font: inherit; font-size: 12.5px; color: var(--text);
  }
  .fields input:focus { outline: none; border-color: var(--blue); }

  button {
    width: 100%; padding: 8px 10px; border: 0; border-radius: 8px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  button.primary { background: var(--blue); color: #fff; }
  button.primary:hover { background: #0a4cb8; }
  button.ghost {
    background: #fff; color: var(--text); border: 1px solid var(--line);
    margin-top: 8px;
  }
  button.ghost:hover { background: #f6f7f9; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  #result {
    min-height: 17px; margin-top: 9px; font-size: 12px;
    color: var(--muted); word-break: break-all;
  }
  #result.ok { color: #1e7b34; }
  #result.err { color: #a33; }

  .foot { margin-top: 10px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <div class="head">
    <b>SOCKS5</b>
    <span id="state">读取中…</span>
  </div>

  <div class="row">
    <div>
      <div class="label">启用代理</div>
      <div class="hint">ssh -D / Clash / v2ray 的本地 SOCKS5</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="fields">
    <label>主机<input id="host" type="text" placeholder="127.0.0.1" autocomplete="off" spellcheck="false"></label>
    <label style="max-width:96px">端口<input id="port" type="number" min="1" max="65535" placeholder="8081"></label>
  </div>

  <button id="test" class="primary">测试连接</button>
  <div id="result"></div>

  <button id="direct" class="ghost">恢复直连</button>

  <div class="foot" id="control"></div>

  <script src="popup.js"></script>
</body>
</html>
